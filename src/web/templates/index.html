<!doctype html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <title>dAI</title>
</head>
<body>
    <h1>dAI</h1>

    <p>Gibanje: <strong id="imu">čakam…</strong></p>
    <p>Zvok: <strong id="mic">čakam…</strong></p>

    <script>
        async function osvezi() {
            const odgovor = await fetch("/api/state");
            const stanje = await odgovor.json();

            if(stanje.error){
                document.getElementById("imu").textContent = "napaka";
                document.getElementById("mic").textContent = "napaka";
                return;
            }

            if(!stanje.connected){
                document.getElementById("imu").textContent = "povezava prekinjena";
                document.getElementById("mic").textContent = "povezava prekinjena";
                return;
            }

            // null pomeni, da model še nima stabilne oznake
            if (stanje.imu !== null) {
                document.getElementById("imu").textContent = stanje.imu;
            }
            if (stanje.mic !== null) {
                document.getElementById("mic").textContent = stanje.mic;
            }
        }

        // vsako sekundo vprašamo server za novo stanje
        setInterval(osvezi, 1000);
    </script>
</body>
</html>
